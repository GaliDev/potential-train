<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Workforce Governance — Final Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --ink:#14161B; --muted:#565C68; --faint:#878D99; --hair:#E6E8EC; --hair-strong:#D2D6DD;
  --brand:#37356B; --brand-2:#5B57C2; --brand-wash:#EFEEFB; --brand-line:#D9D7F1;
  --ok:#1F7A52; --ok-wash:#E7F4ED; --ok-line:#BFE3CE;
  --warn:#B5701A; --warn-wash:#FBF1E0; --warn-line:#EFD8B0;
  --bad:#BE3B34; --bad-wash:#FBEBE9; --bad-line:#F1CFCC;
  --neutral:#565C68; --neutral-wash:#EDEFF2;
  --r:8px; --r-lg:12px; --r-xl:16px;
  --shadow-sm:0 1px 2px rgba(20,22,28,.05);
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 10px 28px -18px rgba(20,22,28,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",system-ui,sans-serif; color:var(--ink); background:#0B0C10; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.015em}

/* ---------- Deck shell ---------- */
.stage{position:fixed; inset:0; display:grid; place-items:center}
.slide{
  position:absolute; width:min(1180px, 94vw); height:min(664px, 92vh);
  background:var(--paper); border-radius:18px; overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7);
  opacity:0; transform:translateY(18px) scale(.985); pointer-events:none;
  transition:opacity .32s ease, transform .32s ease;
  display:flex; flex-direction:column;
}
.slide.active{opacity:1; transform:none; pointer-events:auto}
.slide.dark{background:var(--brand); color:#fff}

/* slide chrome */
.s-pad{flex:1; padding:46px 56px; display:flex; flex-direction:column; min-height:0}
.eyebrow{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--brand-2); font-weight:600}
.slide.dark .eyebrow{color:#B7B3F0}
.s-title{font-size:38px; line-height:1.08; margin:8px 0 4px}
.s-sub{font-size:18px; color:var(--muted); font-weight:400; max-width:62ch}
.slide.dark .s-sub{color:#D7D5F2}

/* footer bar with presenter + progress */
.foot{height:46px; display:flex; align-items:center; gap:14px; padding:0 22px; background:var(--surface); border-top:1px solid var(--hair); font-size:12.5px; color:var(--faint)}
.slide.dark .foot{background:rgba(0,0,0,.18); border-top:1px solid rgba(255,255,255,.12); color:#C9C7E8}
.foot .who{display:inline-flex; align-items:center; gap:7px; font-weight:600; color:var(--brand)}
.slide.dark .foot .who{color:#fff}
.foot .who .av{width:9px;height:9px;border-radius:50%}
.foot .time{font-family:"IBM Plex Mono",monospace}
.foot .spacer{flex:1}
.foot .pageno{font-family:"IBM Plex Mono",monospace}
.av.elena{background:var(--brand-2)} .av.gali{background:var(--ok)} .av.gil{background:var(--warn)} .av.all{background:linear-gradient(90deg,var(--brand-2),var(--ok),var(--warn))}

/* generic helpers */
.row{display:flex; gap:22px}
.col{flex:1; min-width:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid4{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.spread{margin-top:auto}
.card{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-lg); padding:16px 18px; box-shadow:var(--shadow-sm)}
.card h3{font-size:15px; margin-bottom:8px}
.lead{font-size:18px; line-height:1.5}
ul.clean{list-style:none; margin:14px 0 0; padding:0}
ul.clean li{position:relative; padding:7px 0 7px 22px; font-size:17px; color:var(--ink); line-height:1.45}
ul.clean li::before{content:""; position:absolute; left:0; top:15px; width:8px;height:8px;border-radius:2px; background:var(--brand-2)}
.slide.dark ul.clean li{color:#EDECFB}
.quote{font-size:18px; font-weight:500; color:var(--ink)}
.tag{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; padding:4px 11px; border-radius:999px; background:var(--brand-wash); color:var(--brand); border:1px solid var(--brand-line)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 12px; border-radius:999px}
.pill.ok{background:var(--ok-wash); color:var(--ok)} .pill.warn{background:var(--warn-wash); color:var(--warn)} .pill.bad{background:var(--bad-wash); color:var(--bad)} .pill.neutral{background:var(--neutral-wash); color:var(--neutral)}

/* ---------- Slide 1: title ---------- */
.hero{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:0 70px; position:relative; z-index:2}
.hero .mark{width:54px;height:54px;border-radius:14px; background:rgba(255,255,255,.12); display:grid;place-items:center; font-size:26px; margin-bottom:22px; border:1px solid rgba(255,255,255,.2)}
.hero h1{font-size:60px; line-height:1.02; letter-spacing:-.02em}
.hero .tagline{font-size:23px; color:#CFCDF2; margin-top:16px; font-weight:400}
.hero .team{margin-top:34px; display:flex; gap:26px; font-size:14px; color:#B7B3F0}
.hero .team b{color:#fff; font-weight:600}
.ghost-ui{position:absolute; right:-40px; bottom:-30px; width:560px; opacity:.10; transform:rotate(-4deg); pointer-events:none; z-index:1}
.ghost-ui .gbar{height:14px; background:#fff; border-radius:6px; margin:8px 0}
.repo{position:absolute; left:70px; bottom:30px; font-size:13px; color:#9A96D8}

/* ---------- problem cards ---------- */
.pcards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px}
.pcard{background:var(--surface); border:1px solid var(--hair); border-left:3px solid var(--brand-2); border-radius:10px; padding:14px 16px}
.pcard .q{font-size:17px; font-weight:600; color:var(--ink)}
.pcard .a{font-size:13.5px; color:var(--muted); margin-top:4px}

/* ---------- arch diagram ---------- */
.flow{display:flex; align-items:stretch; gap:0; margin-top:18px}
.fstage{flex:1; background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:16px 14px; text-align:center; position:relative; display:flex; flex-direction:column; justify-content:center}
.fstage.llm{background:var(--brand-wash); border-color:var(--brand-line)}
.fstage .ico{font-size:22px}
.fstage .nm{font-weight:600; font-size:15px; margin-top:6px}
.fstage .dt{font-size:12px; color:var(--muted); margin-top:4px}
.fstage.llm .dt{color:var(--brand)}
.farrow{display:flex; align-items:center; padding:0 6px; color:var(--brand-2); font-size:22px; font-weight:700}
.feedback{margin-top:14px; text-align:center; font-size:13px; color:var(--muted); font-style:italic}
.feedback b{color:var(--brand-2)}

/* ---------- full-system architecture slide ---------- */
.arch-pad{padding:30px 40px 22px}
.arch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:18px}
.legend{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding-top:6px}
.legend .lg{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:500}
.legend .sw{width:14px;height:14px;border-radius:4px; border:1px solid var(--hair-strong)}
.legend .sw.llm{background:#E9E7FB; border-color:var(--brand-line)}
.legend .sw.det{background:#fff}
.legend .sw.fb{background:transparent; border:0; border-top:2px dashed var(--brand-2); border-radius:0; width:18px; height:0}
.arch-frame{flex:1; min-height:0; margin:14px 0 12px; background:#0B0C10; border:1px solid var(--hair-strong); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:14px; box-shadow:var(--shadow-sm)}
.arch-frame img{max-width:100%; max-height:100%; object-fit:contain; display:block}
.arch-foot{font-size:13.5px; color:var(--muted); line-height:1.45}
.arch-foot b{color:var(--brand-2)}
.slide.dark .arch-frame{background:#08090d}

/* Mermaid diagram frame */
.mmd-frame{flex:1; min-height:0; margin:16px 0 6px; background:#fff; border:1px solid var(--hair-strong); border-radius:12px; padding:14px; overflow:hidden; box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center}
.mmd-frame .mermaid{width:100%; margin:0; text-align:center; line-height:1}
.mmd-frame .mermaid svg{max-width:100%; max-height:100%; height:auto !important}
.mmd-frame .mermaid:not([data-processed]){color:var(--faint); font-family:"IBM Plex Mono",monospace; font-size:11px; white-space:pre-wrap; text-align:left}
.mmd-frame .edgeLabel{font-size:11px !important; font-weight:600}

/* custom flowchart */
.fc{flex:1; display:flex; flex-direction:column; min-height:0; margin-top:12px}
.fc-spine{flex:1; display:flex; align-items:stretch; min-height:0}
.fc-stage{flex:1; background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:11px 12px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-sm); min-width:0}
.fc-stage.wide{flex:1.5}
.fc-stage.narrow{flex:.85}
.fc-h{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.fc-arr{display:flex; align-items:center; padding:0 6px; color:var(--brand-2); font-size:22px; font-weight:700}
.fc-node{border:1px solid var(--hair-strong); border-radius:8px; padding:9px 11px; font-size:13.5px; font-weight:600; line-height:1.2}
.fc-node small{display:block; font-weight:400; color:var(--muted); font-size:11px; margin-top:3px; line-height:1.35}
.fc-node.llm{background:var(--brand-wash); border-color:var(--brand-line); color:var(--brand)}
.fc-node.llm small{color:var(--brand-2)}
.fc-node.console{background:var(--ink); color:#fff; border-color:var(--ink); text-align:center; margin:auto 0}
.fc-node.console small{color:#B7B3F0}
.fc-node.sm{font-size:12.5px; padding:7px 9px}
.fc-judges{display:flex; flex-direction:column; gap:4px}
.jr{font-size:11.5px; background:var(--brand-wash); border:1px solid var(--brand-line); border-radius:6px; padding:4px 9px; display:flex; justify-content:space-between; gap:8px; color:var(--brand); font-weight:500}
.jr b{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:10.5px}
.jr.safe{background:var(--ok-wash); border-color:var(--ok-line); color:var(--ok)}
.fc-agg{font-size:12.5px; font-weight:600; background:#fff; border:1.5px solid var(--brand); border-radius:8px; padding:8px 10px; color:var(--ink); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.fc-agg.gate{border-color:var(--ok)}
.det-tag{font-size:9.5px; letter-spacing:.04em; text-transform:uppercase; background:var(--neutral-wash); color:var(--neutral); padding:2px 7px; border-radius:5px; font-weight:600}
.fc-db{display:flex; flex-direction:column; gap:5px}
.fc-db div{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; background:var(--surface-2); border:1px solid var(--hair); border-radius:6px; padding:6px 8px; display:flex; justify-content:space-between; align-items:center}
.fc-db div span{font-family:"IBM Plex Sans",sans-serif; font-weight:400; color:var(--faint); font-size:10.5px}
.fc-trace{font-size:11px; color:var(--muted); background:var(--surface-2); border:1px dashed var(--hair-strong); border-radius:6px; padding:5px 8px; font-weight:600; margin-top:auto}
.fc-trace small{display:block; font-weight:400; color:var(--faint); font-size:10px; margin-top:2px; line-height:1.3}
.fc-gov{display:flex; flex-direction:column; gap:4px}
.gc{font-size:11.5px; font-weight:600; background:var(--surface-2); border:1px solid var(--hair-strong); border-radius:6px; padding:5px 8px; text-align:center}
.fc-val{display:flex; align-items:center; gap:11px; margin-top:11px; padding:9px 12px; background:var(--surface-2); border:1px dashed var(--hair-strong); border-radius:10px; flex-wrap:wrap}
.vchip{font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px; white-space:nowrap}
.vchip.gold{background:var(--warn-wash); color:var(--warn); border:1px solid var(--warn-line)}
.vchip.bench{background:var(--ok-wash); color:var(--ok); border:1px solid var(--ok-line); font-family:"IBM Plex Mono",monospace; font-size:11.5px}
.varr{color:var(--faint); font-weight:700}
.vnote{font-size:11.5px; color:var(--muted); font-style:italic}
.vnote b{color:var(--ink); font-style:normal}
.fc-loop{display:flex; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:2px dashed var(--brand-2)}
.fc-loop .la{color:var(--brand-2); font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:700; letter-spacing:-1px}
.fc-loop .lt{font-size:12.5px; color:var(--brand-2); font-weight:600}

/* ---------- 5-judge graph ---------- */
.graph{display:flex; align-items:center; gap:0; margin-top:14px; flex:1}
.gnode{background:var(--surface); border:1px solid var(--hair-strong); border-radius:9px; padding:9px 12px; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:188px}
.gnode .gm{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; color:#fff; background:var(--brand-2); padding:2px 7px; border-radius:5px}
.gnode.safety{border-color:var(--ok-line); background:var(--ok-wash)} .gnode.safety .gm{background:var(--ok)}
.judges{display:flex; flex-direction:column; gap:9px}
.gstart, .gagg, .gend{background:var(--brand); color:#fff; border-radius:10px; padding:14px 14px; text-align:center; font-weight:600}
.gstart{font-size:14px} .gend{font-size:14px; background:var(--ink)}
.gagg{background:#fff; color:var(--ink); border:2px solid var(--brand); min-width:210px}
.gagg .at{font-size:14px} .gagg .ad{font-size:11.5px; color:var(--muted); margin-top:5px; font-weight:400; line-height:1.4}
.gconn{flex:1; min-width:18px; display:flex; align-items:center; justify-content:center; color:var(--brand-2); font-weight:700}
.reducer{font-family:"IBM Plex Mono",monospace; font-size:12px; text-align:center; margin-top:12px; color:var(--brand); background:var(--brand-wash); border:1px solid var(--brand-line); border-radius:8px; padding:7px 10px}
.formula{font-family:"IBM Plex Mono",monospace; font-size:13.5px; background:var(--ink); color:#E6EDF3; border-radius:10px; padding:14px 16px; margin-top:12px; line-height:1.7}
.formula .gate{color:#FF9D8A; font-weight:600}
.formula .w{color:#9A8CFF}

/* ---------- mock fleet table (slide 5/6) ---------- */
.mtable{background:var(--surface); border:1px solid var(--hair); border-radius:12px; overflow:hidden; margin-top:14px; box-shadow:var(--shadow-sm)}
.mhead, .mrow{display:grid; grid-template-columns:1.7fr 1.2fr 1fr .9fr; align-items:center; padding:11px 16px}
.mhead{background:var(--surface-2); border-bottom:1px solid var(--hair); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:600}
.mrow{border-bottom:1px solid var(--hair); font-size:14px}
.mrow:last-child{border-bottom:0}
.mrow.flagged{background:var(--bad-wash)}
.aid{font-family:"IBM Plex Mono",monospace; font-weight:600; display:flex; flex-direction:column}
.aid small{font-family:"IBM Plex Sans"; font-weight:400; color:var(--faint); font-size:11.5px}
.tier{display:inline-flex; align-items:center; gap:6px; font-size:13px}
.tier .sq{width:9px;height:9px;border-radius:3px}
.tier.full .sq{background:var(--ok)} .tier.spot .sq{background:var(--brand-2)} .tier.hil .sq{background:var(--warn)} .tier.blocked .sq{background:var(--bad)}
.anno{display:inline-grid; place-items:center; width:20px;height:20px; border-radius:50%; background:var(--brand); color:#fff; font-size:11px; font-weight:700; font-family:"IBM Plex Mono",monospace; margin-left:8px; vertical-align:middle}

/* precedence chain */
.chain{display:flex; margin-top:16px}
.gate{flex:1; background:var(--surface); border:1px solid var(--hair); padding:12px 14px; position:relative}
.gate:first-child{border-radius:9px 0 0 9px} .gate:last-child{border-radius:0 9px 9px 0}
.gate + .gate{border-left:0}
.gate .gn{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--faint)}
.gate .gv{font-size:14px; font-weight:600; margin-top:3px}
.gate.binding{background:#fff; border-color:var(--bad); box-shadow:0 0 0 2px var(--bad) inset; z-index:1}
.gate.binding .gn, .gate.binding .gv{color:var(--bad)}
.gate.pass .gv{color:var(--ok)}
.gate .ar{position:absolute; right:-9px; top:50%; transform:translateY(-50%); z-index:2; color:var(--faint); background:var(--paper); font-size:12px}
.gate:last-child .ar{display:none}

/* ---------- methodology ---------- */
.method{display:flex; align-items:center; gap:0; margin-top:8px; flex-wrap:wrap}
.mstep{background:var(--surface); border:1px solid var(--hair); border-radius:9px; padding:11px 13px; font-size:13.5px; font-weight:600}
.mstep.now{background:var(--ok-wash); border-color:var(--ok-line); color:var(--ok)}
.marrow{padding:0 9px; color:var(--brand-2); font-weight:700}

/* ---------- charts ---------- */
.bars{display:flex; align-items:flex-end; gap:18px; height:230px; padding:0 8px; margin-top:8px; position:relative; border-bottom:2px solid var(--hair-strong)}
.bargrp{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px}
.bar{width:62%; max-width:64px; background:var(--brand-2); border-radius:6px 6px 0 0; position:relative; transition:height .5s ease}
.bar .bv{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap}
.bar.win{background:var(--ok)}
.blabel{font-size:12.5px; color:var(--muted); text-align:center; font-weight:500}
.threshold{position:absolute; left:0; right:0; border-top:2px dashed var(--bad); }
.threshold .tl{position:absolute; right:0; top:-18px; font-size:11.5px; color:var(--bad); font-weight:600; background:var(--paper); padding:0 4px}

.scatter{position:relative; height:240px; margin-top:8px; background:var(--surface); border:1px solid var(--hair); border-radius:12px}
.axis-x{position:absolute; left:0; right:0; bottom:26px; border-top:1px solid var(--hair-strong)}
.axlabel{position:absolute; font-size:11.5px; color:var(--faint); font-family:"IBM Plex Mono",monospace}
.dot{position:absolute; width:16px;height:16px; border-radius:50%; transform:translate(-50%,50%); box-shadow:0 0 0 4px rgba(91,87,194,.15)}
.dot .dl{position:absolute; left:22px; top:50%; transform:translateY(-50%); white-space:nowrap; font-size:12px; font-weight:600}
.dot .dl small{display:block; font-weight:400; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:11px}
.dot.shipped{background:var(--ok)} .dot.gpt{background:var(--brand-2)} .dot.grok{background:var(--warn)} .dot.claude{background:var(--bad)}

.crit-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px}
.crit-strip .cs{background:var(--surface); border:1px solid var(--hair); border-radius:8px; padding:9px 10px; text-align:center}
.crit-strip .cs .c{font-size:12px; color:var(--muted)} .crit-strip .cs .m{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; margin-top:3px}

/* big metric tiles */
.tiles3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px}
.mt{background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:22px; text-align:center; box-shadow:var(--shadow-sm)}
.mt .v{font-family:"IBM Plex Mono",monospace; font-size:42px; font-weight:600; letter-spacing:-.02em; line-height:1}
.mt.good .v{color:var(--ok)} .mt .k{font-size:13.5px; color:var(--muted); margin-top:10px; line-height:1.35}
.honest{margin-top:18px; background:var(--warn-wash); border:1px solid var(--warn-line); border-radius:10px; padding:13px 16px; font-size:14.5px; color:var(--warn); display:flex; gap:10px; align-items:center}

/* recap / next steps */
.recap{display:flex; flex-direction:column; gap:10px}
.recap .step{display:flex; align-items:center; gap:12px; font-size:18px}
.recap .step .n{width:28px;height:28px;border-radius:8px; background:var(--brand); color:#fff; display:grid;place-items:center; font-size:14px; font-weight:700; flex:none}
.next{background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:16px 18px}

/* ---------- controls ---------- */
.hud{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:rgba(20,22,28,.82); backdrop-filter:blur(8px); border-radius:999px; padding:7px 9px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.4); transition:opacity .3s}
.hud.idle{opacity:0; pointer-events:none}
.hud button{border:0; background:transparent; color:#C9C7E8; width:34px;height:34px; border-radius:50%; cursor:pointer; font-size:16px; display:grid; place-items:center; transition:.12s}
.hud button:hover{background:rgba(255,255,255,.12); color:#fff}
.hud .pos{font-family:"IBM Plex Mono",monospace; color:#fff; font-size:13px; min-width:54px; text-align:center}
.dots{position:fixed; top:16px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:50}
.dots i{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.28); cursor:pointer; transition:.15s}
.dots i.on{background:#fff; transform:scale(1.3)}
.hint{position:fixed; bottom:20px; right:22px; color:rgba(255,255,255,.4); font-size:12px; z-index:50; font-family:"IBM Plex Mono",monospace}

@media print{ body{overflow:visible} .hud,.dots,.hint{display:none} .slide{position:relative; opacity:1!important; transform:none!important; page-break-after:always; margin:0 auto 20px; box-shadow:none} }
</style>
</head>

/* ===== Render + navigation ===== */
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
slides.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark?' dark':'');
  el.innerHTML = s.html + `<div class="foot"><span class="who"><span class="av ${s.who}"></span>${s.role}</span><span class="time">${s.time}</span><span class="spacer"></span><span class="pageno">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></div>`;
  stage.appendChild(el);
  const d = document.createElement('i'); d.dataset.i=i; dotsWrap.appendChild(d);
});

/* render the Mermaid architecture diagram (themed to match the deck) */
if(window.mermaid){
  try{
    mermaid.initialize({
      startOnLoad:false, securityLevel:'loose', theme:'base',
      fontFamily:'"IBM Plex Sans", system-ui, sans-serif',
      themeVariables:{
        primaryColor:'#EFEEFB', primaryBorderColor:'#5B57C2', primaryTextColor:'#37356B',
        lineColor:'#878D99', clusterBkg:'#FAFBFC', clusterBorder:'#D2D6DD',
        edgeLabelBackground:'#FFFFFF', fontSize:'14px'
      },
      flowchart:{ useMaxWidth:true, htmlLabels:true, curve:'basis', nodeSpacing:26, rankSpacing:44 }
    });
    mermaid.run({ querySelector:'.mermaid' });
  }catch(e){ console.error('Mermaid render failed', e); }
}

let cur = 0;
const els = [...document.querySelectorAll('.slide')];
const dots = [...document.querySelectorAll('#dots i')];
const pos = document.getElementById('pos');
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  els.forEach((e,i)=>e.classList.toggle('active', i===cur));
  dots.forEach((e,i)=>e.classList.toggle('on', i===cur));
  pos.textContent = `${cur+1} / ${slides.length}`;
  location.hash = cur+1;
}
function nextS(){ show(cur+1); } function prevS(){ show(cur-1); }

document.getElementById('next').onclick = nextS;
document.getElementById('prev').onclick = prevS;
document.getElementById('full').onclick = ()=> document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
dotsWrap.onclick = e=>{ if(e.target.dataset.i!=null) show(+e.target.dataset.i); };

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); nextS(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prevS(); }
  else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(slides.length-1); }
  else if(e.key.toLowerCase()==='f'){ document.getElementById('full').click(); }
});

/* swipe (touch) */
let tx=0; document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){ dx<0?nextS():prevS(); } },{passive:true});

/* auto-hide HUD */
const hud = document.getElementById('hud'); let idle;
